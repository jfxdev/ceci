services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leaflag
      POSTGRES_USER: leaflag
      POSTGRES_PASSWORD: leaflag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaflag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
