services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ceci
      POSTGRES_USER: ceci
      POSTGRES_PASSWORD: ceci
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceci"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
